<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Antennas / Ears -->
  <rect x="5" y="13" width="2" height="6" rx="1" fill="#4A5568"/>
  <rect x="25" y="13" width="2" height="6" rx="1" fill="#4A5568"/>
  <circle cx="16" cy="5" r="1.5" fill="lime"/>
  <line x1="16" y1="6" x2="16" y2="9" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>

  <!-- Robot Head/Body -->
  <rect x="6" y="9" width="20" height="16" rx="4" fill="#CBD5E0"/>
  <rect x="7" y="10" width="18" height="14" rx="3" fill="#EDF2F7"/>

  <!-- Visor / Eye Screen -->
